name: devdocqa
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devdocqa
      POSTGRES_USER: devdocqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U devdocqa -d devdocqa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: infra/worker.Dockerfile
    environment:
      PG_DSN: postgresql://devdocqa:${POSTGRES_PASSWORD}@postgres:5432/devdocqa
      INTERNAL_KEY: ${INTERNAL_KEY:?Run python scripts/init_env.py first}
      DATA_DIR: /data/documents
      MODEL_MODE: ${MODEL_MODE:-mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:4b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      MODEL_TIMEOUT_SECONDS: 110
    volumes:
      - document_data:/data/documents
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      PG_DSN: host=postgres port=5432 dbname=devdocqa user=devdocqa password=${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_KEY: ${API_KEY:?Run python scripts/init_env.py first}
      INTERNAL_KEY: ${INTERNAL_KEY:?Run python scripts/init_env.py first}
      AI_SERVICE_URL: http://worker:8001
      DATA_DIR: /data/documents
      STATIC_DIR: /app/web
      DOCQA_PORT: 8080
      DOCQA_BIND: 0.0.0.0
      AI_CONCURRENCY: ${AI_CONCURRENCY:-1}
      QUEUE_CAPACITY: ${QUEUE_CAPACITY:-16}
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-1}
      INGEST_QUEUE_CAPACITY: ${INGEST_QUEUE_CAPACITY:-4}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-120}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-600}
      MODEL_SIGNATURE: ${MODEL_MODE:-mock}/${CHAT_MODEL:-qwen3:4b}/${EMBED_MODEL:-bge-m3}
      EMBEDDING_SIGNATURE: ${EMBEDDING_SIGNATURE:-mock:featurehash-v1}
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - document_data:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/ready]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  pg_data:
  document_data:
